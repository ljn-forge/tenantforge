name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make init
      - run: make deps
      - run: make check
      - run: make integration
      - run: cd web && npx playwright install --with-deps chromium
      - run: TF_E2E_CHANNEL=chromium python3 scripts/browser-check.py
      - run: python3 scripts/recovery-check.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npx --yes @redocly/cli@2.59.0 lint --extends minimal docs/openapi.json
      - run: cd web && npm audit --audit-level=high
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: docker compose --profile app build
